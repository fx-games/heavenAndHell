<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Of Heaven and Hell</title>
<style>
	:root { --bg: #0b0b0d; --panel: #16161a; --line: #2b2b33; --text: #d8d8de; --dim: #8a8a96; --accent: #d9b24c; --gut: #1d1d23; }
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
		font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
	#bar { display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--panel);
		border-bottom: 1px solid var(--line); height: 32px; white-space: nowrap; }
	#bar h1 { font-size: 14px; margin: 0 8px 0 0; color: var(--accent); letter-spacing: .04em; }
#bar h1 a { color: inherit; text-decoration: none; }
	#bar .sp { flex: 1; }
	#bar .hint { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
	button { background: #22222a; color: var(--text); border: 1px solid var(--line); border-radius: 4px;
		padding: 2px 10px; font: inherit; cursor: pointer; }
	button:hover { border-color: var(--accent); }
	#reset { display: none; }
	body.multi #reset { display: inline-block; }

	/* One window: the game fills the page. Multi window: a side column and a bottom row of feed windows,
	   resized by dragging the gutters, rearranged by dropping one window's title on another's. */
	#game { position: absolute; inset: 32px 0 0 0; display: grid; background: var(--gut);
		grid-template: "main" 1fr / 1fr; }
	body.multi #game { grid-template: "main vg side" 1fr "hg hg hg" 6px "bottom bottom bottom" var(--bottom)
		/ 1fr 6px var(--side); }
	#frame { grid-area: main; width: 100%; height: 100%; border: 0; background: #000; }
	#side, #bottom, .gut { display: none; }
	body.multi #side, body.multi #bottom { display: flex; min-width: 0; min-height: 0; }
	body.multi .gut { display: block; }
	#side { grid-area: side; flex-direction: column; }
	#bottom { grid-area: bottom; }
	.gut { background: var(--gut); touch-action: none; flex: none; }
	.gut:hover, .gut.drag { background: var(--accent); }
	#vg { grid-area: vg; cursor: col-resize; }
	#hg { grid-area: hg; cursor: row-resize; }
	#side > .gut { height: 6px; cursor: row-resize; }
	#bottom > .gut { width: 6px; cursor: col-resize; }
	body.dragging #frame { pointer-events: none; } /* else the iframe eats the pointer mid-drag */
	.win { display: flex; flex-direction: column; min-width: 0; min-height: 0; flex-basis: 0; background: #000;
		border: 1px solid var(--line); }
	.win.over { border-color: var(--accent); }
	.win > .t { flex: none; display: flex; align-items: center; font-size: 11px; height: 20px; padding: 0 2px 0 6px;
		color: var(--dim); background: var(--panel); border-bottom: 1px solid var(--line); cursor: grab; }
	.win > .t .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.win > .t .zoom { flex: none; display: flex; gap: 2px; visibility: hidden; }
	.win > .t:hover .zoom { visibility: visible; }
	.win > .t .zoom button { padding: 0 5px; font-size: 11px; line-height: 14px; height: 16px; }
	.win > pre { flex: 1; margin: 0; padding: 2px 6px; overflow: auto; color: #c0c0c0;
		font-family: ui-monospace, Menlo, monospace; line-height: 1.3; white-space: pre; }
	@media (max-width: 700px) { body.multi #game { grid-template: "main" 1fr / 1fr; } body.multi #side,
		body.multi #bottom, body.multi .gut { display: none; } }
</style>
</head>
<body>
<div id="bar">
	<h1><a href="../shrine/of-heaven-and-hell.html">Of Heaven and Hell</a></h1>
	<button id="mode" title="Show inventory, equipment, what you see and the message log next to the map">Multi window</button>
	<button id="reset" title="Put every window back where it started">Reset windows</button>
	<span class="sp"></span>
	<span class="hint" id="hint">Loading…</span>
</div>
<div id="game">
	<iframe id="frame" src="game.html" title="Game"></iframe>
	<div class="gut" id="vg"></div><div id="side"></div>
	<div class="gut" id="hg"></div><div id="bottom"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const game = $("game"), frame = $("frame"), modeBtn = $("mode");
const titles = { inventory: "Inventory", equipment: "Equipment", visible_actors: "Monsters in view",
	visible_items: "Items in view", log: "Messages", character: "Character" };
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const MIN = 40; // px, smallest window along a split

// The layout: which window sits where, the side column's width, the bottom row's height, each window's share
// of its column/row and font size. Kept in localStorage, per browser. The two splits follow the browser window
// (null) until the player drags them.
const defaults = () => ({ side: ["inventory", "equipment", "visible_actors", "visible_items"], bottom: ["log", "character"],
	sideW: null, bottomH: null, weight: {}, font: {} });
let L = defaults();
try { Object.assign(L, JSON.parse(localStorage.getItem("hh.layout"))); } catch {}
const known = [...L.side, ...L.bottom];
if (known.length !== 6 || !Object.keys(titles).every((n) => known.includes(n))) L = defaults(); // stale or broken
const save = () => { try { localStorage.setItem("hh.layout", JSON.stringify(L)); } catch {} };

const wins = {}, panes = {};
for (const [name, title] of Object.entries(titles)) {
	const win = document.createElement("div");
	win.className = "win";
	win.innerHTML = `<div class="t" draggable="true"><span class="name">${title}</span>
		<span class="zoom"><button data-d="-1" title="Smaller text">A−</button><button data-d="1" title="Bigger text">A+</button></span></div><pre></pre>`;
	win.addEventListener("mouseup", () => { if (!getSelection().toString()) frame.focus(); }); // keys stay with the game
	for (const b of win.querySelectorAll("button")) {
		b.onmousedown = (e) => e.preventDefault(); // a focused button would swallow the game's keys
		b.onclick = () => { L.font[name] = clamp((L.font[name] || 12) + +b.dataset.d, 8, 28); save(); render(); };
	}
	// Rearrange: drop a window's title on another window to swap the two
	const t = win.firstChild;
	t.ondragstart = (e) => e.dataTransfer.setData("text/hh-win", name);
	win.ondragover = (e) => { if (e.dataTransfer.types.includes("text/hh-win")) { e.preventDefault(); win.classList.add("over"); } };
	win.ondragleave = () => win.classList.remove("over");
	win.ondrop = (e) => {
		win.classList.remove("over");
		const from = e.dataTransfer.getData("text/hh-win");
		if (!from || from === name) return;
		for (const list of [L.side, L.bottom]) for (let i = 0; i < list.length; i++)
			list[i] = list[i] === from ? name : list[i] === name ? from : list[i];
		save(); rebuild();
	};
	wins[name] = win;
	panes[name] = win.querySelector("pre");
}

// drag runs onMove(dx, dy) while a gutter is dragged, relative to where the drag started.
function drag(gut, e, onMove) {
	const x0 = e.clientX, y0 = e.clientY;
	gut.setPointerCapture(e.pointerId);
	gut.classList.add("drag"); document.body.classList.add("dragging");
	gut.onpointermove = (ev) => { onMove(ev.clientX - x0, ev.clientY - y0); render(); };
	gut.onpointerup = () => {
		gut.onpointermove = gut.onpointerup = null;
		gut.classList.remove("drag"); document.body.classList.remove("dragging");
		save(); frame.focus();
	};
}
$("vg").onpointerdown = (e) => { const w = sideW(); drag($("vg"), e, (dx) => { L.sideW = w - dx; }); };
$("hg").onpointerdown = (e) => { const h = bottomH(); drag($("hg"), e, (dx, dy) => { L.bottomH = h - dy; }); };

// A gutter inside the column/row moves the edge between its two neighbours; their shares become pixel sizes.
function innerGutter(a, b, vertical) {
	const g = document.createElement("div");
	g.className = "gut";
	g.onpointerdown = (e) => {
		const size = (n) => vertical ? wins[n].offsetHeight : wins[n].offsetWidth;
		for (const n of vertical ? L.side : L.bottom) L.weight[n] = size(n); // shares in px from here on
		const sa = L.weight[a], sum = sa + L.weight[b];
		drag(g, e, (dx, dy) => { L.weight[a] = clamp(sa + (vertical ? dy : dx), MIN, sum - MIN); L.weight[b] = sum - L.weight[a]; });
	};
	return g;
}

function fill(box, names, vertical) {
	box.replaceChildren();
	names.forEach((n, i) => {
		if (i) box.append(innerGutter(names[i - 1], n, vertical));
		box.append(wins[n]);
	});
}

// The splits' pixel sizes, clamped so the map keeps at least 240×160 and every window its title bar.
const sideW = () => { const w = game.clientWidth || innerWidth; return clamp(L.sideW ?? Math.round(w * .24), 120, Math.max(120, w - 240)); };
const bottomH = () => { const h = game.clientHeight || innerHeight; return clamp(L.bottomH ?? Math.round(h * .2), MIN + 20, Math.max(MIN + 20, h - 166)); };

// render restyles (sizes, shares, fonts); rebuild also re-places the windows, after a swap or a reset.
function render() {
	game.style.setProperty("--side", sideW() + "px");
	game.style.setProperty("--bottom", bottomH() + "px");
	for (const n of Object.keys(titles)) {
		wins[n].style.flexGrow = L.weight[n] || 1;
		panes[n].style.fontSize = (L.font[n] || 12) + "px";
	}
}
function rebuild() { fill($("side"), L.side, true); fill($("bottom"), L.bottom, false); render(); }
addEventListener("resize", render);
$("reset").onmousedown = (e) => e.preventDefault();
$("reset").onclick = () => { L = defaults(); save(); rebuild(); frame.focus(); };

// ansiToHtml handles what game/feeds.go writes: 0 reset, 31/37, 38;2;r;g;b and 48;2;r;g;b.
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
function ansiToHtml(text) {
	let out = "", open = false;
	for (const [i, part] of text.split(/\x1b\[([\d;]*)m/).entries()) {
		if (i % 2 === 0) { out += esc(part); continue; }
		if (open) out += "</span>";
		const n = part.split(";").map(Number), css = [];
		for (let k = 0; k < n.length; k++) {
			if (n[k] === 31) css.push("color:#e04040");
			else if (n[k] === 38 || n[k] === 48) { css.push(`${n[k] === 38 ? "color" : "background"}:rgb(${n[k + 2]},${n[k + 3]},${n[k + 4]})`); k += 4; }
		}
		open = css.length > 0;
		if (open) out += `<span style="${css.join(";")}">`;
	}
	return open ? out + "</span>" : out;
}

// hhFeed is called by fs.js in the game frame whenever the game rewrites a feed file.
window.hhFeed = (name, text, append) => {
	const pre = panes[name];
	if (!pre) return;
	if (!append) { pre.innerHTML = ansiToHtml(text); return; }
	const atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 4;
	pre.insertAdjacentHTML("beforeend", ansiToHtml(text));
	while (pre.childNodes.length > 2000) pre.firstChild.remove(); // ponytail: trims nodes, not lines
	if (atEnd) pre.scrollTop = pre.scrollHeight;
};
window.hhLoaded = () => { $("hint").textContent = "Click the game to play"; frame.focus(); };

function setMode(multi) {
	document.body.classList.toggle("multi", multi);
	modeBtn.textContent = multi ? "One window" : "Multi window";
	try { localStorage.setItem("hh.multi", multi ? "1" : ""); } catch {}
	rebuild();
	frame.focus();
}
modeBtn.onmousedown = (e) => e.preventDefault();
modeBtn.onclick = () => setMode(!document.body.classList.contains("multi"));
let multi = false;
try { multi = localStorage.getItem("hh.multi") === "1"; } catch {}
setMode(multi);
</script>
</body>
</html>
