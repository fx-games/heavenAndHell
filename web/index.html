<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Of Heaven and Hell</title>
<style>
	:root { --bg: #0b0b0d; --panel: #16161a; --line: #2b2b33; --text: #d8d8de; --dim: #8a8a96; --accent: #d9b24c;
		--gut: #1d1d23; --gut-hover: #d9b24c; }
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
		font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
	#bar { display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--panel);
		border-bottom: 1px solid var(--line); height: 32px; white-space: nowrap; overflow: hidden; }
	#bar h1 { font-size: 14px; margin: 0 8px 0 0; color: var(--accent); letter-spacing: .04em; }
	#bar h1 a { color: inherit; text-decoration: none; }
	#bar .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; flex: none; }
	#bar .sp { flex: 1; }
	#bar .hint { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
	button { background: #22222a; color: var(--text); border: 1px solid var(--line); border-radius: 4px;
		padding: 2px 10px; font: inherit; cursor: pointer; }
	button:hover { border-color: var(--accent); }

	/* Windows are placed by rvip-wm.js: the game in #t-map, the feeds (inventory, log, ...) as text windows */
	#game { position: absolute; left: 0; right: 0; top: 32px; bottom: 0; overflow: hidden; background: var(--gut); }
	.win { position: absolute; background: #000; border: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
	.win > .t { flex: none; display: flex; align-items: center; font-size: 11px; height: 20px; padding: 0 2px 0 6px;
		color: var(--dim); background: var(--panel); border-bottom: 1px solid var(--line); }
	.win > .t .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.win > .body { flex: 1; min-height: 0; overflow: hidden; }
	#frame { width: 100%; height: 100%; border: 0; background: #000; display: block; }
	body.dragging #frame { pointer-events: none; } /* else the iframe eats the pointer mid-drag */
	.win > pre { flex: 1; margin: 0; padding: 2px 6px; overflow: auto; color: #c0c0c0;
		font-family: ui-monospace, Menlo, monospace; line-height: 1.3; white-space: pre; }
</style>
</head>
<body>
<div id="bar">
	<h1><a href="../shrine/of-heaven-and-hell.html">Of Heaven and Hell</a></h1>
	<button id="btn-layout"></button>
	<span class="sep"></span>
	<button id="btn-zoom-out" title="Smaller map tiles (n)">Zoom −</button>
	<button id="btn-zoom-in" title="Bigger map tiles (m)">Zoom +</button>
	<span class="sep"></span>
	<button id="btn-sound" title="Sound effects and voices on or off">Sound: off</button>
	<button id="btn-music" title="Music on or off">Music: off</button>
	<span class="sp"></span>
	<span class="hint" id="hint">Loading…</span>
</div>
<div id="game">
	<div class="win" id="t-map"><div class="body"><iframe id="frame" src="game.html" title="Game"></iframe></div></div>
</div>
<script src="rvip-wm.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const frame = $("frame"), hh = () => frame.contentWindow.hh;
const feeds = { inventory: "Inventory", equipment: "Equipment", visible_actors: "Monsters in view",
	visible_items: "Items in view", log: "Messages", character: "Character" };
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// Page settings (window layout, feed font sizes, sound toggles) live in the game's IndexedDB next to its saves.
const idb = new Promise((ok) => { const r = indexedDB.open("heavenandhell", 1);
	r.onupgradeneeded = () => r.result.createObjectStore("f"); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); });
const FILE = "web-layout.json", enc = new TextEncoder(), dec = new TextDecoder();
let L = { wm: null, font: {}, sound: false, music: false };
const save = async () => { const db = await idb; db?.transaction("f", "readwrite").objectStore("f").put(enc.encode(JSON.stringify(L)), FILE); };

const panes = {};
for (const [name, title] of Object.entries(feeds)) {
	const win = document.createElement("div");
	win.className = "win"; win.id = "t-" + name;
	win.innerHTML = `<div class="t"><span class="name"></span></div><pre></pre>`;
	win.addEventListener("mouseup", () => { if (!getSelection().toString()) frame.focus(); }); // keys stay with the game
	$("game").append(win);
	panes[name] = win.querySelector("pre");
}
const render = () => { for (const n in feeds) panes[n].style.fontSize = (L.font[n] || 12) + "px"; };
const col = (a, b) => ({ d: "v", r: .5, a, b });
const multi = { d: "v", r: .8, a: { d: "h", r: .76, a: "map", b: col(col("inventory", "equipment"), col("visible_actors", "visible_items")) },
	b: { d: "h", r: .6, a: "log", b: "character" } };

// ansiToHtml handles what game/feeds.go writes: 0 reset, 31/37, 38;2;r;g;b and 48;2;r;g;b.
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
function ansiToHtml(text) {
	let out = "", open = false;
	for (const [i, part] of text.split(/\x1b\[([\d;]*)m/).entries()) {
		if (i % 2 === 0) { out += esc(part); continue; }
		if (open) out += "</span>";
		const n = part.split(";").map(Number), css = [];
		for (let k = 0; k < n.length; k++) {
			if (n[k] === 31) css.push("color:#e04040");
			else if (n[k] === 38 || n[k] === 48) { css.push(`${n[k] === 38 ? "color" : "background"}:rgb(${n[k + 2]},${n[k + 3]},${n[k + 4]})`); k += 4; }
		}
		open = css.length > 0;
		if (open) out += `<span style="${css.join(";")}">`;
	}
	return open ? out + "</span>" : out;
}

// hhFeed is called by fs.js in the game frame whenever the game rewrites a feed file.
window.hhFeed = (name, text, append) => {
	const pre = panes[name];
	if (!pre) return;
	if (!append) { pre.innerHTML = ansiToHtml(text); return; }
	const atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 4;
	pre.insertAdjacentHTML("beforeend", ansiToHtml(text));
	while (pre.childNodes.length > 2000) pre.firstChild.remove(); // ponytail: trims nodes, not lines
	if (atEnd) pre.scrollTop = pre.scrollHeight;
};
// hhLoaded is called by the game (webBridge) once window.hh exists in the frame.
window.hhLoaded = () => { $("hint").textContent = "Windows ▾: layout · drag bars to resize, titles to move · click the game to play"; audio(); frame.focus(); };

function audio() {
	hh()?.sound(L.sound); hh()?.music(L.music);
	$("btn-sound").textContent = "Sound: " + (L.sound ? "on" : "off");
	$("btn-music").textContent = "Music: " + (L.music ? "on" : "off");
}
const click = (id, f) => { const b = $(id); b.onmousedown = (e) => e.preventDefault(); b.onclick = () => { f(); frame.focus(); }; };
click("btn-zoom-in", () => hh()?.zoom(1));
click("btn-zoom-out", () => hh()?.zoom(-1));
click("btn-sound", () => { L.sound = !L.sound; audio(); save(); });
click("btn-music", () => { L.music = !L.music; audio(); save(); });
// A drag that starts on a bar or a title must not be lost to the iframe
$("game").addEventListener("pointerdown", (e) => { if (e.target.closest(".wm-bar, .t")) document.body.classList.add("dragging"); }, true);
document.addEventListener("pointerup", () => document.body.classList.remove("dragging"), true);

idb.then((db) => new Promise((ok) => { const r = db?.transaction("f").objectStore("f").get(FILE); if (!r) return ok();
	r.onsuccess = () => ok(r.result); r.onerror = () => ok(); })).then((raw) => {
	try { Object.assign(L, JSON.parse(dec.decode(raw))); } catch {}
	const wm = RvipWM({
		area: $("game"), menu: $("btn-layout"),
		wins: [{ id: "map", title: "Map" }, ...Object.entries(feeds).map(([id, title]) => ({ id, title }))],
		multi, single: "map", state: L.wm, noFont: "map",
		save: (st) => { L.wm = st; save(); },
		layout: () => {},
		font: (id, d) => { L.font[id] = clamp((L.font[id] || 12) + d, 8, 28); save(); render(); },
		onReset: () => { L.font = {}; save(); render(); },
	});
	render(); wm.apply();
	addEventListener("resize", wm.apply);
});
</script>
</body>
</html>
